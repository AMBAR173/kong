_format_version: "3.0"

services:

  - name: gp2-service

    host: gp2-service

    port: 8080

    protocol: http

    routes:

      - name: gp2-payments

        paths:
          - /payment/v2/payments

        strip_path: false

      - name: gp2-payment-request

        paths:
          - /payment/v2/payment/request

        strip_path: false

      - name: gp2-payment-status

        paths:
          - /payment/v2/payment/status

        strip_path: false

plugins:

  - name: jwt

    service: gp2-service

  - name: rate-limiting

    service: gp2-service

    config:

      minute: 100

      policy: local
``