api:
  name: gp2
  version: v2
  owner: payments-team

gateway:

  basePath: /payment

  stripPath: false

backend:

  protocol: http

  host: gp2-service

  port: 8080

plugins:

  - name: jwt

  - name: rate-limiting

    config:

      minute: 100

      policy: local

  - name: correlation-id
    config:
        header_name: X-Correlation-ID
        generator: uuid
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
  - name: opentelemetry
    config:
      trace_endpoint: otel-collector.observab.svc.cluster.local:4318/v1/traces

environments:

  dev:

    host: dev-api.company.com

  uat:

    host: uat-api.company.com

  prod:

    host: api.company.com